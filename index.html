<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="年轮背诵">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#ffffff">
<title>年轮背诵</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#fff;color:#111}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.tabbar{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:9}
.tabbar button{flex:1;padding:10px 0;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:15px;color:#666}
.tabbar button.on{background:#111;color:#fff;border-color:#111;font-weight:500}
.card{border:1px solid #e5e5e5;border-radius:14px;padding:18px;margin-bottom:12px}
.blank{border:1px dashed #aaa;border-radius:6px;padding:0 6px;margin:0 2px;background:#f5f5f5;color:#111;font-size:1em}
.blank.hid{color:transparent;user-select:none}
.row{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid #eee;border-radius:12px;margin-bottom:8px}
.tap{cursor:pointer}
.btn{padding:12px 18px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:15px;color:#111}
.btn.pri{background:#111;color:#fff;border-color:#111;font-weight:500}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn.sml{font-size:13px;padding:6px 12px;flex-shrink:0}
.btn.dan{color:#d33;border-color:#f0b4b4}
textarea{width:100%;min-height:140px;border:1px solid #ddd;border-radius:12px;padding:14px;font-size:16px;resize:vertical;font-family:inherit}
input{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
.meta{font-size:12px;color:#999}
.bar{height:4px;border-radius:2px;background:#f0f0f0;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#111}
.banner{padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px;background:#fdf3e3;border:1px solid #f5ddad}
.grade{display:flex;gap:10px}
.grade button{flex:1;padding:14px 0;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:15px;font-weight:500}
.g0{color:#d33}.g1{color:#b8860b}.g2{color:#2a7d2a}
.empty{text-align:center;color:#999;padding:48px 0;font-size:14px;line-height:2}
h3{font-size:17px;font-weight:500;margin:0 0 10px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:13px;color:#666}
.seg button.on{background:#111;color:#fff;border-color:#111}
.stat3{display:flex;gap:10px;margin-bottom:14px}
.stat3>div{flex:1;border:1px solid #eee;border-radius:12px;padding:14px 8px;text-align:center}
.stat3 b{display:block;font-size:24px;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;padding:10px 4px 4px;border:1px solid #eee;border-radius:12px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:0}
.chart .colb{width:70%;border-radius:2px 2px 0 0;background:#ddd}
.chart .col.hot .colb{background:#111}
.chart .cold{font-size:9px;color:#bbb}
.toolrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toolrow .btn{flex:1;min-width:30%;padding:10px 4px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#e33;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{padding:5px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;font-size:13px;color:#666}
.chips button.on{background:#111;color:#fff;border-color:#111}
.fchip{font-size:11px;color:#999;border:1px solid #eee;border-radius:4px;padding:0 4px;margin-left:4px}
.editor textarea{min-height:56vh;font-size:17px;line-height:1.9}
.readmode{font-size:18px;line-height:2.1;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabbar">
    <button id="t1" class="on" onclick="showTab(1)">复习</button>
    <button id="t2" onclick="showTab(2)">卡片库</button>
    <button id="t3" onclick="showTab(3)">统计</button>
    <button id="t4" onclick="showTab(4)">添加</button>
  </div>
  <div id="body"></div>
</div>
<script>
const IV=[5,30,720,1440,2880,5760,10080,21600];
let store={};
try{store=JSON.parse(localStorage.getItem('nianlun_cards')||'{}')}catch(e){}
let cards=store.cards||[];
let hist=store.hist||[];
function cleanHist(h){const seen=new Set();return (h||[]).filter(x=>{const k=(x.cid||0)+'_'+x.g+'_'+Math.floor((x.d||0)/60000);if(seen.has(k))return false;seen.add(k);return true})}
hist=cleanHist(hist);
function save(){try{localStorage.setItem('nianlun_cards',JSON.stringify({cards:cards,hist:hist}))}catch(e){}}
let tab=1,queue=[],qi=0,showAll=false,libFilter='all',folderFilter='全部',single=null,singleMode='study',editingId=null,blankShow={},backupView=null,statDetail=null,statDay=null;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escBr(s){return esc(s).replace(/\n/g,'<br>')}
function renderCloze(text){
  const parts=text.split(/\[\[(.+?)\]\]/gs);let out='';
  for(let k=0;k<parts.length;k++){
    if(k%2===0)out+=escBr(parts[k]);
    else{const key=text.length+'_'+k;const hid=!blankShow[key];
      out+='<button class="blank'+(hid?' hid':'')+'" onclick="toggleBlank('+text.length+','+k+')">'+esc(parts[k])+'</button>';}
  }
  return out;
}
function toggleBlank(l,k){blankShow[l+'_'+k]=!blankShow[l+'_'+k];refresh()}
function revealAll(text){return escBr(text.replace(/\[\[(.+?)\]\]/gs,'$1'))}
function hasCloze(t){return /\[\[.+?\]\]/s.test(t)}
function dueCount(){return cards.filter(c=>c.due<=Date.now()).length}
function isDue(c){return c.due<=Date.now()}
function nextLbl(c){return c.step>=IV.length?'已掌握':('下次复习 '+new Date(c.due).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))}
function folders(){const s=[];cards.forEach(c=>{const f=c.folder||'';if(f&&!s.includes(f))s.push(f)});return s}
function titleOf(c){return c.title?c.title:(c.text.replace(/\[\[(.+?)\]\]/gs,'$1').slice(0,24)+(c.text.length>24?'…':''))}
function refresh(){if(single)renderSingle();else if(queue.length&&qi<queue.length&&tab===1)renderStudy();else render()}

function showTab(t){tab=t;single=null;backupView=null;statDetail=null;statDay=null;if(t!==4)editingId=null;['t1','t2','t3','t4'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',i+1===t));window.scrollTo(0,0);render()}

function cardRow(c){
  return '<div class="row tap" onclick="openCard('+c.id+')"><div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
    esc(titleOf(c))+(c.folder?'<span class="fchip">'+esc(c.folder)+'</span>':'')+'</div></div>'+
    (isDue(c)?'<span class="dot"></span>':'')+'</div>';
}

function render(){
  const b=document.getElementById('body');const n=dueCount();
  if(tab===1){
    if(queue.length&&qi<queue.length){renderStudy();return}
    let h='';
    if(n>0)h+='<div class="banner">🔔 有 <b>'+n+'</b> 张卡片到期（红点标记），该复习了</div>';
    if(cards.length===0){
      h+='<div class="empty">还没有卡片<br>去「添加」创建第一条记忆<br><br><span style="font-size:13px">挖坑语法：光合作用发生在[[叶绿体]]中</span></div>';
    }else{
      const mastered=cards.filter(c=>c.step>=IV.length).length;
      h+='<div class="card" style="text-align:center"><div style="font-size:34px;font-weight:600">'+cards.length+'</div><div class="meta">共 '+cards.length+' 张 · 待复习 '+n+' · 已掌握 '+mastered+'</div>'+
      '<div class="bar" style="margin:10px 0 14px"><i style="width:'+(cards.length?mastered/cards.length*100:0)+'%"></i></div>';
      if(n>0)h+='<button class="btn pri big" onclick="startReview()">开始复习 '+n+' 张</button>';
      else h+='<div class="meta">全部完成，最早一张 '+nextLbl(cards.slice().sort((a,b)=>a.due-b.due)[0])+'</div>';
      h+='</div>';
      const list=cards.slice().sort((a,b)=>(isDue(b)?1:0)-(isDue(a)?1:0)||a.due-b.due);
      h+='<div class="meta" style="margin:6px 2px">全部卡片（点开背诵或阅读）</div>'+list.map(cardRow).join('');
    }
    b.innerHTML=h;
  }else if(tab===2){
    let list=cards.slice();
    if(libFilter==='due')list=list.filter(isDue);
    if(libFilter==='done')list=list.filter(c=>c.step>=IV.length);
    if(folderFilter!=='全部')list=list.filter(c=>(c.folder||'')===folderFilter);
    list.sort((a,b)=>(isDue(b)?1:0)-(isDue(a)?1:0)||a.due-b.due);
    const fs=folders();
    let h='<div class="seg">'+
    '<button class="'+(libFilter==='all'?'on':'')+'" onclick="setFilter(&quot;all&quot;)">全部 '+cards.length+'</button>'+
    '<button class="'+(libFilter==='due'?'on':'')+'" onclick="setFilter(&quot;due&quot;)">待复习 '+dueCount()+'</button>'+
    '<button class="'+(libFilter==='done'?'on':'')+'" onclick="setFilter(&quot;done&quot;)">已掌握 '+cards.filter(c=>c.step>=IV.length).length+'</button></div>';
    if(fs.length)h+='<div class="chips"><button class="'+(folderFilter==='全部'?'on':'')+'" onclick="folderFilter=&quot;全部&quot;;render()">全部文件夹</button>'+
      fs.map(f=>'<button class="'+(folderFilter===f?'on':'')+'" onclick="folderFilter=&quot;'+esc(f)+'&quot;;render()">'+esc(f)+'</button>').join('')+'</div>';
    h+=list.length?list.map(cardRow).join(''):'<div class="empty">没有卡片</div>';
    b.innerHTML=h;
  }else if(tab===3){
    if(statDetail){renderStatDetail();return}
    b.innerHTML=renderStats();
  }else{
    const c=editingId?cards.find(x=>x.id===editingId):null;
    const fs=folders();
    b.innerHTML='<div class="editor"><h3>'+(c?'编辑卡片':'新卡片')+'</h3>'+
    '<input id="title" placeholder="标题（列表中显示，建议填写）" style="margin-bottom:8px" value="'+(c?esc(c.title||''):'')+'">'+
    '<input id="folder" list="fdl" placeholder="文件夹（可选，如：英语单词）" style="margin-bottom:8px" value="'+(c?esc(c.folder||''):'')+'">'+
    (fs.length?'<datalist id="fdl">'+fs.map(f=>'<option value="'+esc(f)+'">').join('')+'</datalist>':'')+
    '<textarea id="nt" placeholder="输入要背诵的内容，用 [[ ]] 包住需要挖空的部分。&#10;&#10;例如：&#10;光合作用发生在[[叶绿体]]中，需要[[光]]、[[二氧化碳]]和水，产生[[氧气]]。">'+(c?esc(c.text):'')+'</textarea></div>'+
    '<button class="btn pri big" style="margin-top:12px" onclick="saveCard()">'+(c?'保存修改':'保存并加入复习计划')+'</button>'+
    (c?'<button class="btn big" style="margin-top:8px" onclick="editingId=null;showTab(2)">取消编辑</button>':'')+
    '<div class="meta" style="margin-top:12px;line-height:1.8">保存后 5 分钟开始第一轮复习，之后依次：30分钟 → 12小时 → 1天 → 2天 → 4天 → 7天 → 15天。「模糊」= 间隔再来；「忘记」= 从头开始。</div>';
  }
}
function setFilter(f){libFilter=f;render()}
function saveCard(){
  const t=document.getElementById('nt').value.trim();if(!t)return;
  const ti=(document.getElementById('title').value||'').trim();
  const fo=(document.getElementById('folder').value||'').trim();
  if(editingId){const c=cards.find(x=>x.id===editingId);if(c){c.title=ti;c.folder=fo;c.text=t;save();showTab(2);return}}
  cards.push({id:Date.now(),title:ti,folder:fo,text:t,step:0,due:Date.now()+IV[0]*60000});
  save();showTab(1);
}
function editCard(id){editingId=id;single=null;showTab(4)}
function del(id){if(!confirm('删除这张卡片？'))return;cards=cards.filter(c=>c.id!==id);save();render()}
function openCard(id){single=cards.find(c=>c.id===id);singleMode='study';blankShow={};showAll=false;renderSingle()}
function backFromSingle(){single=null;render()}
function setSingleMode(m){singleMode=m;blankShow={};showAll=false;renderSingle()}

function pickVoice(lang){if(!('speechSynthesis' in window))return null;const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang&&v.lang.toLowerCase().indexOf(lang)===0)||vs.find(v=>v.lang&&v.lang.toLowerCase().indexOf(lang.slice(0,2))===0)||null}
function speakText(t){
  if(!('speechSynthesis' in window)){alert('当前环境不支持语音朗读');return}
  speechSynthesis.cancel();
  const clean=t.replace(/\[\[(.+?)\]\]/gs,'$1');
  const letters=(clean.match(/[a-zA-Z]/g)||[]).length;
  const nonSpace=clean.replace(/\s/g,'').length||1;
  const lang=letters/nonSpace>0.5?'en-US':'zh-CN';
  const u=new SpeechSynthesisUtterance(clean);
  u.lang=lang;u.rate=0.92;
  const v=pickVoice(lang);if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function startReview(){queue=cards.filter(isDue);qi=0;showAll=false;blankShow={};renderStudy()}
function toggleAll(){showAll=!showAll;refresh()}
function studyBody(c){
  return showAll?revealAll(c.text):(hasCloze(c.text)?renderCloze(c.text):esc(c.text));
}
function renderStudy(){
  const c=queue[qi];const b=document.getElementById('body');
  b.innerHTML='<div class="meta" style="margin-bottom:8px">第 '+(qi+1)+' / '+queue.length+' 张 · 第 '+Math.min(c.step+1,IV.length)+'/'+IV.length+' 轮</div>'+
  '<div class="card" style="font-size:19px;line-height:2">'+(c.title?'<div class="meta" style="margin-bottom:6px">'+esc(c.title)+'</div>':'')+studyBody(c)+'</div>'+
  '<button class="btn big" style="margin-bottom:14px" onclick="toggleAll()">'+(showAll?'隐藏答案':'显示全部')+'</button>'+
  '<div class="grade"><button class="g0" onclick="grade(0)">忘记<span class="meta" style="display:block;font-weight:400">从头再来</span></button>'+
  '<button class="g1" onclick="grade(1)">模糊<span class="meta" style="display:block;font-weight:400">间隔再来</span></button>'+
  '<button class="g2" onclick="grade(2)">记得<span class="meta" style="display:block;font-weight:400">下一轮</span></button></div>'+
  '<div class="toolrow"><button class="btn" style="flex:1" onclick="speakText(queue[qi].text)">朗读全文</button><button class="btn" style="flex:1" onclick="stopSpeak()">停止</button></div>'+
  '<div class="toolrow"><button class="btn" onclick="speakText(queue[qi].text)">🔊 朗读</button><button class="btn" onclick="stopSpeak()">⏹ 停止</button><button class="btn" onclick="editCard('+c.id+')">编辑此卡</button><button class="btn" onclick="queue=[];showTab(1)">退出</button></div>';
}
function renderSingle(){
  const c=single;if(!c){render();return}
  const b=document.getElementById('body');
  const seg='<div class="seg"><button class="'+(singleMode==='study'?'on':'')+'" onclick="setSingleMode(&quot;study&quot;)">背诵模式</button><button class="'+(singleMode==='read'?'on':'')+'" onclick="setSingleMode(&quot;read&quot;)">阅读模式</button></div>';
  const body=singleMode==='read'?'<div class="card readmode">'+(c.title?'<div class="meta" style="margin-bottom:10px">'+esc(c.title)+'</div>':'')+revealAll(c.text)+'</div>'
    :'<div class="card" style="font-size:19px;line-height:2">'+studyBody(c)+'</div>'+
      '<button class="btn big" style="margin-bottom:14px" onclick="toggleAll()">'+(showAll?'隐藏答案':'显示全部')+'</button>'+
      '<div class="grade"><button class="g0" onclick="gradeSingle(0)">忘记</button><button class="g1" onclick="gradeSingle(1)">模糊</button><button class="g2" onclick="gradeSingle(2)">记得</button></div>';
  b.innerHTML='<div class="meta" style="margin-bottom:8px">'+(c.title?esc(c.title)+' · ':'')+(c.folder?esc(c.folder)+' · ':'')+nextLbl(c)+' · 第 '+Math.min(c.step+1,IV.length)+'/'+IV.length+' 轮</div>'+
  seg+body+
  '<div class="toolrow"><button class="btn" onclick="speakText(single.text)">🔊 朗读</button><button class="btn" onclick="stopSpeak()">⏹ 停止</button><button class="btn" onclick="editCard('+c.id+')">编辑此卡</button>'+
  '<button class="btn dan" onclick="del('+c.id+')">删除</button>'+
  '<button class="btn" onclick="backFromSingle()">返回列表</button></div>';
}
function applyGrade(c,g){
  if(g===0)c.step=0;else if(g===2)c.step=Math.min(c.step+1,IV.length);
  c.due=Date.now()+IV[Math.min(c.step,IV.length-1)]*60000;
  const last=hist[hist.length-1];const nowTs=Date.now();
  if(!(last&&last.cid===c.id&&last.g===g&&nowTs-last.d<60000))hist.push({d:nowTs,g:g,cid:c.id});
  if(hist.length>5000)hist=hist.slice(-3000);
  save();
}
function grade(g){
  applyGrade(queue[qi],g);qi++;showAll=false;blankShow={};
  if(qi>=queue.length){
    document.getElementById('body').innerHTML='<div class="card" style="text-align:center;padding:48px 16px"><div style="font-size:22px;font-weight:600;margin-bottom:8px">本轮复习完成</div><div class="meta">遗忘曲线已重置，它追不上你。</div><button class="btn pri big" style="margin-top:20px" onclick="queue=[];showTab(1)">完成</button></div>';
  }else renderStudy();
}
function gradeSingle(g){applyGrade(single,g);showAll=false;blankShow={};renderSingle()}

function exportBackup(){
  backupView='export';
  const data=JSON.stringify({v:1,cards:cards,hist:hist});
  const b64=btoa(unescape(encodeURIComponent(data)));
  const b=document.getElementById('body');
  b.innerHTML='<h3>导出备份</h3><div class="card"><div class="meta" style="margin-bottom:8px;line-height:1.8">长按下方文本框 → 全选 → 复制，把备份码保存到备忘录或微信收藏。恢复时粘贴即可还原全部卡片和复习记录。</div>'+
  '<textarea id="bk" readonly style="min-height:30vh;font-size:12px">'+b64+'</textarea>'+
  '<button class="btn pri big" style="margin-top:10px" onclick="copyBackup()">一键复制备份码</button>'+
  '<button class="btn big" style="margin-top:8px" onclick="backupView=null;render()">返回</button></div>';
}
function copyBackup(){
  const t=document.getElementById('bk');
  t.select&&t.select();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>alert('已复制，去备忘录粘贴保存吧')).catch(()=>alert('复制失败，请长按文本框手动全选复制'))}
  else alert('请长按文本框手动全选复制');
}
function importBackup(){
  backupView='import';
  const b=document.getElementById('body');
  b.innerHTML='<h3>导入恢复</h3><div class="card"><div class="meta" style="margin-bottom:8px;line-height:1.8">粘贴之前导出的备份码，将<b>覆盖</b>当前全部数据（当前 '+cards.length+' 张卡片）。</div>'+
  '<textarea id="imp" placeholder="在这里粘贴备份码" style="min-height:30vh;font-size:12px"></textarea>'+
  '<button class="btn pri big" style="margin-top:10px" onclick="doImport(\'replace\')">覆盖恢复（数据变成本备份的样子）</button>'+
  '<button class="btn big" style="margin-top:8px" onclick="doImport(\'merge\')">合并恢复（两边卡片都保留，不丢数据）</button>'+
  '<button class="btn big" style="margin-top:8px" onclick="backupView=null;render()">返回</button></div>';
}
function doImport(mode){
  const s=(document.getElementById('imp').value||'').trim().replace(/\s/g,'');
  if(!s){alert('请先粘贴备份码');return}
  let data=null;
  try{data=JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){}
  if(!data||!Array.isArray(data.cards)){alert('备份码无效，请确认复制完整');return}
  const parsed=data.cards.map(c=>({id:c.id||Date.now()+Math.random(),title:c.title||'',folder:c.folder||'',text:String(c.text||''),step:c.step||0,due:c.due||Date.now()}));
  const bh=Array.isArray(data.hist)?data.hist:[];
  if(mode==='replace'){
    if(!confirm('覆盖恢复将替换当前 '+cards.length+' 张卡片，确定继续？'))return;
    cards=parsed;hist=bh;
    save();backupView=null;single=null;queue=[];qi=0;
    alert('恢复成功，共 '+cards.length+' 张卡片');showTab(1);return;
  }
  const byId={};cards.forEach(c=>byId[c.id]=c);
  let add=0,upd=0;
  parsed.forEach(c=>{if(byId[c.id]){if((c.step||0)>(byId[c.id].step||0)){byId[c.id]=c;upd++}}else{byId[c.id]=c;add++}});
  cards=Object.values(byId);
  const seen=new Set(hist.map(h=>h.d+'_'+h.g));
  bh.forEach(h=>{const k=h.d+'_'+h.g;if(!seen.has(k)){seen.add(k);hist.push(h)}});
  if(hist.length>5000)hist=hist.slice(-3000);
  save();backupView=null;single=null;queue=[];qi=0;
  alert('合并完成：新增 '+add+' 张 · 进度更新 '+upd+' 张 · 共 '+cards.length+' 张');showTab(1);
}
function dayMap(){
  const now=new Date();now.setHours(0,0,0,0);
  const map={};
  hist.forEach(h=>{const d=new Date(h.d);const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();map[key]=(map[key]||0)+1});
  return {now:now,map:map};
}
function streakKeys(){const dm=dayMap();const keys=[];for(let i=0;;i++){const d=new Date(dm.now.getTime()-i*86400000);const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if((dm.map[key]||0)>0)keys.push({key:key,lbl:(d.getMonth()+1)+'月'+d.getDate()+'日',cnt:dm.map[key],today:i===0});else{if(i===0)continue;break}}return keys}
function goBackStat(){statDetail=(statDetail==='day')?'month':null;render()}
function renderStatDetail(){
  const b=document.getElementById('body');
  let h='<button class="btn sml" style="margin-bottom:10px" onclick="goBackStat()">‹ 返回</button>';
  if(statDetail==='total'){
    const list=hist.slice().sort((a,b2)=>b2.d-a.d).slice(0,50);
    h+='<h3>最近复习记录</h3>';
    h+=list.length?list.map(x=>{
      const c=cards.find(cc=>cc.id===x.cid);
      const gl=['忘记','模糊','记得'][x.g]||'';
      const gc=['g0','g1','g2'][x.g]||'';
      return '<div class="row'+(c?' tap':'')+'"'+(c?' onclick="openCard('+x.cid+')"':'')+'><div style="flex:1;min-width:0"><div style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c?titleOf(c):'（卡片已删除）')+'</div><div class="meta">'+new Date(x.d).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+(c?' · 点按查看':'')+'</div></div><span class="'+gc+'" style="font-size:14px;font-weight:500;flex-shrink:0">'+gl+'</span></div>';
    }).join(''):'<div class="empty">还没有复习记录</div>';
  }else if(statDetail==='streak'){
    const keys=streakKeys();
    h+='<h3>连续背诵明细</h3>';
    h+=keys.length?keys.map(k=>'<div class="row"><div style="flex:1"><div style="font-size:15px">'+k.lbl+(k.today?'（今天）':'')+'</div></div><span class="meta">'+k.cnt+' 次复习</span></div>').join(''):'<div class="empty">今天还没复习，点开始吧</div>';
  }else if(statDetail==='rate'){
    const r=hist.slice(-100);
    const cnt=[0,0,0];r.forEach(x=>cnt[x.g]=(cnt[x.g]||0)+1);
    const names=['忘记','模糊','记得'],cls=['g0','g1','g2'];
    h+='<h3>最近 '+(r.length||0)+' 次评分构成</h3><div class="card">';
    h+=names.map((n,i)=>{const p=r.length?Math.round(cnt[i]/r.length*100):0;
      return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:14px"><span class="'+cls[i]+'">'+n+'</span><span>'+cnt[i]+' 次 · '+p+'%</span></div><div class="bar" style="height:8px;margin-top:4px"><i style="width:'+p+'%"></i></div></div>'}).join('');
    h+='</div>';
  }else if(statDetail==='month'){
    const dm=dayMap();const now=new Date();
    const year=now.getFullYear(),mon=now.getMonth();
    const list=[];
    for(let d=1;d<=now.getDate();d++){const key=year+'-'+(mon+1)+'-'+d;const c=dm.map[key]||0;const dt=new Date(year,mon,d);if(c>0||dt.getTime()===dm.now.getTime())list.push({key:key,lbl:(mon+1)+'月'+d+'日',cnt:c,today:dt.getTime()===dm.now.getTime()})}
    const tot=list.reduce((s,x)=>s+x.cnt,0);
    h+='<h3>本月逐日复习</h3><div class="meta" style="margin-bottom:8px">共 '+tot+' 次</div>';
    h+=list.length?list.map(k=>'<div class="row tap" onclick="statDay=&quot;'+k.key+'&quot;;statDetail=&quot;day&quot;;renderStatDetail()"><div style="flex:1"><div style="font-size:15px">'+k.lbl+(k.today?'（今天）':'')+'</div></div><span class="meta">'+k.cnt+' 次 ›</span></div>').join(''):'<div class="empty">本月还没有复习</div>';
  }else if(statDetail==='day'){
    const list=hist.filter(x=>{const d=new Date(x.d);return (d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())===statDay}).sort((a,b2)=>b2.d-a.d);
    const p=(statDay||'').split('-');
    h+='<h3>'+(p[1]||'')+'月'+(p[2]||'')+'日 · 复习了哪些卡</h3>';
    h+=list.length?list.map(x=>{
      const c=cards.find(cc=>cc.id===x.cid);
      const gl=['忘记','模糊','记得'][x.g]||'';
      const gc=['g0','g1','g2'][x.g]||'';
      return '<div class="row'+(c?' tap':'')+'"'+(c?' onclick="openCard('+x.cid+')"':'')+'><div style="flex:1;min-width:0"><div style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c?titleOf(c):'（卡片已删除）')+'</div><div class="meta">'+new Date(x.d).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+(c?' · 点按查看':'')+'</div></div><span class="'+gc+'" style="font-size:14px;font-weight:500;flex-shrink:0">'+gl+'</span></div>';
    }).join(''):'<div class="empty">这一天没有记录</div>';
  }else if(statDetail==='mastered'){
    const list=cards.filter(c=>c.step>=IV.length);
    h+='<h3>已掌握卡片（'+list.length+'）</h3>';
    h+=list.length?list.map(cardRow).join(''):'<div class="empty">还没有掌握的卡片</div>';
  }else if(statDetail==='cards'){
    h+='<h3>卡片分布</h3>';
    const fs=folders();
    const un=cards.filter(c=>!(c.folder||'')).length;
    const groups=[{name:'未分类',cnt:un}].concat(fs.map(f=>({name:f,cnt:cards.filter(c=>(c.folder||'')===f).length})));
    const max=Math.max(1,...groups.map(g=>g.cnt));
    h+='<div class="card">'+groups.map(g=>'<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+esc(g.name)+'</span><span>'+g.cnt+' 张</span></div><div class="bar" style="height:8px;margin-top:4px"><i style="width:'+Math.round(g.cnt/max*100)+'%"></i></div></div>').join('')+'</div>';
  }
  b.innerHTML=h;
}
function renderStats(){
  const now=new Date();now.setHours(0,0,0,0);
  const days=[];const map={};
  for(let i=29;i>=0;i--){const d=new Date(now.getTime()-i*86400000);const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();map[key]=0;days.push({key:key,lbl:(d.getMonth()+1)+'/'+d.getDate(),today:i===0});}
  hist.forEach(h=>{const d=new Date(h.d);const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(key in map)map[key]++;});
  const max=Math.max(1,...Object.values(map));
  let streak=0;
  for(let i=0;;i++){const d=new Date(now.getTime()-i*86400000);const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if((map[key]||0)>0)streak++;else{if(i===0)continue;break}}
  const recent=hist.slice(-100);
  const okRate=recent.length?Math.round(recent.filter(h=>h.g===2).length/recent.length*100):0;
  const monthCnt=hist.filter(h=>{const d=new Date(h.d);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}).length;
  const mastered=cards.filter(c=>c.step>=IV.length).length;
  return '<div class="stat3">'+
    '<div class="tap" onclick="statDetail=&quot;total&quot;;render()"><b>'+hist.length+'</b><span class="meta">总复习 ›</span></div>'+
    '<div class="tap" onclick="statDetail=&quot;streak&quot;;render()"><b>'+streak+'</b><span class="meta">连续天数 ›</span></div>'+
    '<div class="tap" onclick="statDetail=&quot;rate&quot;;render()"><b>'+okRate+'%</b><span class="meta">记得率 ›</span></div></div>'+
    '<div class="stat3">'+
    '<div class="tap" onclick="statDetail=&quot;month&quot;;render()"><b>'+monthCnt+'</b><span class="meta">本月复习 ›</span></div>'+
    '<div class="tap" onclick="statDetail=&quot;mastered&quot;;render()"><b>'+mastered+'</b><span class="meta">已掌握 ›</span></div>'+
    '<div class="tap" onclick="statDetail=&quot;cards&quot;;render()"><b>'+cards.length+'</b><span class="meta">卡片总数 ›</span></div></div>'+
    '<h3>近 30 天背诵趋势</h3>'+
    '<div class="chart">'+days.map(d=>'<div class="col'+(d.today?' hot':'')+'"><div class="colb" style="height:'+Math.round(map[d.key]/max*80)+'px"></div><div class="cold">'+d.lbl.split('/')[1]+'</div></div>').join('')+'</div>'+
    '<div class="meta" style="margin-top:6px">每天复习次数（黑柱=今天）</div>'+
    '<h3 style="margin-top:18px">数据备份</h3>'+
    '<div class="toolrow"><button class="btn" onclick="exportBackup()">导出备份</button><button class="btn" onclick="importBackup()">导入恢复</button></div>'+
    '<div class="meta" style="margin-top:6px">数据保存在本机，换手机或误删前请先备份</div>';
}
render();
</script>
