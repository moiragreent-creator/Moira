<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="年轮背诵">
<meta name="theme-color" content="#ffffff">
<title>年轮背诵</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#fff;color:#111}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.tabbar{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:9}
.tabbar button{flex:1;padding:10px 0;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:15px;color:#666}
.tabbar button.on{background:#111;color:#fff;border-color:#111;font-weight:500}
.card{border:1px solid #e5e5e5;border-radius:14px;padding:18px;margin-bottom:12px}
.blank{border:1px dashed #aaa;border-radius:6px;padding:0 6px;margin:0 2px;background:#f5f5f5;color:#111;font-size:1em;transition:background .15s}
.blank.hid{color:transparent;user-select:none;text-shadow:none}
.blank.hid::selection{background:transparent}
.row{display:flex;align-items:flex-start;gap:10px;padding:14px;border:1px solid #eee;border-radius:12px;margin-bottom:8px}
.btn{padding:12px 18px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:15px;color:#111}
.btn.pri{background:#111;color:#fff;border-color:#111;font-weight:500}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn.dan{color:#d33;border-color:#f0b4b4;font-size:13px;padding:6px 12px;flex-shrink:0}
textarea{width:100%;min-height:140px;border:1px solid #ddd;border-radius:12px;padding:14px;font-size:16px;resize:vertical;font-family:inherit}
.meta{font-size:12px;color:#999}
.bar{height:4px;border-radius:2px;background:#f0f0f0;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#111}
.banner{padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px;background:#eef7ee;border:1px solid #d8ecd8}
.banner.warn{background:#fdf3e3;border-color:#f5ddad}
.grade{display:flex;gap:10px}
.grade button{flex:1;padding:14px 0;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:15px;font-weight:500}
.g0{color:#d33}.g1{color:#b8860b}.g2{color:#2a7d2a}
.empty{text-align:center;color:#999;padding:48px 0;font-size:14px;line-height:2}
h3{font-size:17px;font-weight:500;margin:0 0 10px}
input{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
.chip{padding:3px 10px;border-radius:8px;font-size:12px;background:#f0f0f0;color:#555;display:inline-block;margin:2px 4px 2px 0}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:13px;color:#666}
.seg button.on{background:#111;color:#fff;border-color:#111}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabbar">
    <button id="t1" class="on" onclick="showTab(1)">复习</button>
    <button id="t2" onclick="showTab(2)">卡片库</button>
    <button id="t3" onclick="showTab(3)">添加</button>
  </div>
  <div id="body"></div>
</div>
<script>
const IV=[5,30,720,1440,2880,5760,10080,21600];
const IVL=['5分钟','30分钟','12小时','1天','2天','4天','7天','15天'];
let store={};
try{store=JSON.parse(localStorage.getItem('nianlun_cards')||'{}')}catch(e){}
let cards=store.cards||[];
function save(){try{localStorage.setItem('nianlun_cards',JSON.stringify({cards:cards}))}catch(e){}}
let tab=1,queue=[],qi=0,showAll=false,libFilter='all';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderCloze(text){
  const parts=text.split(/\[\[(.+?)\]\]/gs);let out='';
  for(let k=0;k<parts.length;k++){
    if(k%2===0)out+=esc(parts[k]);
    else out+='<button class="blank hid" onclick="this.classList.toggle(\'hid\')">'+esc(parts[k])+'</button>';
  }
  return out;
}
function revealAll(text){return esc(text.replace(/\[\[(.+?)\]\]/gs,'$1'))}
function hasCloze(t){return /\[\[.+?\]\]/s.test(t)}
function dueCount(){return cards.filter(c=>c.due<=Date.now()).length}
function nextLbl(c){return c.step>=IV.length?'已掌握':('下次复习 '+new Date(c.due).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))}

function showTab(t){tab=t;['t1','t2','t3'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',i+1===t));window.scrollTo(0,0);render()}

function render(){
  const b=document.getElementById('body');const n=dueCount();
  if(tab===1){
    if(queue.length&&qi<queue.length){renderStudy();return}
    let h='';
    if(n>0)h+='<div class="banner warn">🔔 有 <b>'+n+'</b> 张卡片到期，该复习了</div>';
    if(cards.length===0){
      h+='<div class="empty">还没有卡片<br>去「添加」创建第一条记忆<br><br><span style="font-size:13px">挖坑语法：光合作用发生在[[叶绿体]]中</span></div>';
    }else{
      const mastered=cards.filter(c=>c.step>=IV.length).length;
      h+='<div class="card" style="text-align:center"><div style="font-size:34px;font-weight:600">'+cards.length+'</div><div class="meta">共 '+cards.length+' 张 · 待复习 '+n+' · 已掌握 '+mastered+'</div>'+
      '<div class="bar" style="margin:10px 0 14px"><i style="width:'+(cards.length?mastered/cards.length*100:0)+'%"></i></div>';
      if(n>0)h+='<button class="btn pri big" onclick="startReview()">开始复习 '+n+' 张</button>';
      else h+='<div class="meta">全部完成，最早一张 '+nextLbl(cards.slice().sort((a,b)=>a.due-b.due)[0])+'</div>';
      h+='</div>';
      const soon=cards.filter(c=>c.due>Date.now()).sort((a,b)=>a.due-b.due).slice(0,6);
      if(soon.length)h+='<div class="meta" style="margin:6px 2px">即将到期</div>'+soon.map(c=>'<div class="row"><div style="flex:1"><div style="font-size:15px">'+renderCloze(c.text.slice(0,40))+(c.text.length>40?'…':'')+'</div><div class="meta">'+nextLbl(c)+'</div></div></div>').join('');
    }
    b.innerHTML=h;
  }else if(tab===2){
    let list=cards.slice();
    if(libFilter==='due')list=list.filter(c=>c.due<=Date.now());
    if(libFilter==='done')list=list.filter(c=>c.step>=IV.length);
    list.sort((a,b)=>a.due-b.due);
    let h='<div class="seg"><button class="'+(libFilter==='all'?'on':'')+'" onclick="libFilter=&quot;all&quot;;render()">全部 '+cards.length+'</button>'+
    '<button class="'+(libFilter==='due'?'on':'')+'" onclick="libFilter=&quot;due&quot;;render()">待复习 '+dueCount()+'</button>'+
    '<button class="'+(libFilter==='done'?'on':'')+'" onclick="libFilter=&quot;done&quot;;render()">已掌握 '+cards.filter(c=>c.step>=IV.length).length+'</button></div>';
    h+=list.length?list.map(c=>'<div class="row"><div style="flex:1"><div style="font-size:15px;line-height:1.8">'+renderCloze(c.text)+'</div>'+
      '<div class="meta">'+nextLbl(c)+' · 第 '+Math.min(c.step+1,IV.length)+'/'+IV.length+' 轮</div>'+
      '<div class="bar"><i style="width:'+(c.step/IV.length*100)+'%"></i></div></div>'+
      '<button class="btn dan" onclick="del('+c.id+')">删除</button></div>').join('')
      :'<div class="empty">没有卡片</div>';
    b.innerHTML=h;
  }else{
    b.innerHTML='<h3>新卡片</h3>'+
    '<input id="title" placeholder="标题（可选，如：生物·光合作用）" style="margin-bottom:8px">'+
    '<textarea id="nt" placeholder="输入要背诵的内容，用 [[ ]] 包住需要挖空的部分。\n\n例如：\n光合作用发生在[[叶绿体]]中，需要[[光]]、[[二氧化碳]]和水，产生[[氧气]]。"></textarea>'+
    '<button class="btn pri big" style="margin-top:12px" onclick="addCard()">保存并加入复习计划</button>'+
    '<div class="meta" style="margin-top:12px;line-height:1.8">保存后 '+IVL[0]+'开始第一轮复习，之后依次：'+IVL.slice(1).join(' → ')+'。\n「模糊」= 本轮间隔再来一次；「忘记」= 从头开始。</div>';
  }
}
function addCard(){
  const t=document.getElementById('nt').value.trim();if(!t)return;
  const ti=(document.getElementById('title').value||'').trim();
  cards.push({id:Date.now(),title:ti,text:t,step:0,due:Date.now()+IV[0]*60000});
  save();showTab(1);
}
function del(id){if(!confirm('删除这张卡片？'))return;cards=cards.filter(c=>c.id!==id);save();render()}
function startReview(){queue=cards.filter(c=>c.due<=Date.now());qi=0;showAll=false;renderStudy()}
function toggleAll(){showAll=!showAll;renderStudy()}
function renderStudy(){
  const c=queue[qi];const b=document.getElementById('body');
  const bodyHtml=showAll?revealAll(c.text):(hasCloze(c.text)?renderCloze(c.text):esc(c.text));
  b.innerHTML='<div class="meta" style="margin-bottom:8px">第 '+(qi+1)+' / '+queue.length+' 张 · 第 '+Math.min(c.step+1,IV.length)+'/'+IV.length+' 轮</div>'+
  '<div class="card" style="font-size:19px;line-height:2">'+(c.title?'<div class="meta" style="margin-bottom:6px">'+esc(c.title)+'</div>':'')+bodyHtml+'</div>'+
  '<button class="btn big" style="margin-bottom:14px" onclick="toggleAll()">'+(showAll?'隐藏答案':'显示全部')+'</button>'+
  '<div class="grade"><button class="g0" onclick="grade(0)">忘记<span class="meta" style="display:block;font-weight:400">从头再来</span></button>'+
  '<button class="g1" onclick="grade(1)">模糊<span class="meta" style="display:block;font-weight:400">间隔再来</span></button>'+
  '<button class="g2" onclick="grade(2)">记得<span class="meta" style="display:block;font-weight:400">下一轮</span></button></div>';
}
function grade(g){
  const c=queue[qi];
  if(g===0)c.step=0;else if(g===2)c.step=Math.min(c.step+1,IV.length);
  c.due=Date.now()+IV[Math.min(c.step,IV.length-1)]*60000;
  save();qi++;showAll=false;
  if(qi>=queue.length){
    document.getElementById('body').innerHTML='<div class="card" style="text-align:center;padding:48px 16px"><div style="font-size:22px;font-weight:600;margin-bottom:8px">本轮复习完成</div><div class="meta">遗忘曲线已重置，它追不上你。</div><button class="btn pri big" style="margin-top:20px" onclick="queue=[];showTab(1)">完成</button></div>';
  }else renderStudy();
}
render();
</script>
</body>
</html>
